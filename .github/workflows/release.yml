name: Release

# Drafts a GitHub release when a package tag is pushed. Nothing reaches npm
# here: publish.yml publishes once someone publishes the draft.
#
# Tags are `<dir>-v<version>`, where <dir> is the package's directory under
# packages/ or plugins/ (scripts/tag.mjs creates them). The package is derived
# from the tag, so adding a package needs no change here. Legacy bare `v*`
# tags don't match `*-v*` and stay inert.
#
# Release notes come from the package's Conventional Commits since its
# previous release (scripts/release-notes.mjs, conventional-changelog): only
# the commits that touched its folder, however long the range.
on:
  push:
    tags:
      - '*-v*'

permissions:
  contents: write

jobs:
  draft:
    name: Draft GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the package's previous tag must be found
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 'lts/*', cache: 'pnpm' }
      # The release scripts' own dependencies only (the root package)
      - run: pnpm install --frozen-lockfile --filter @commercelayer/cli-monorepo

      - name: Resolve package
        id: meta
        run: node scripts/resolve-tag.mjs "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"

      - name: Generate release notes for this package
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs "$GITHUB_REF_NAME" "${{ steps.meta.outputs.previous_tag }}" > release-notes.md
          cat release-notes.md

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.meta.outputs.package }} v${{ steps.meta.outputs.version }}
          draft: true
          prerelease: ${{ steps.meta.outputs.prerelease }}
          body_path: release-notes.md
