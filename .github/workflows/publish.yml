name: Publish

# Releases the package versions not on npm yet, on every push to main: merging
# an approved release pull request (`pnpm release:publish`) publishes it, with
# no other manual step.
#
# `cl-release ship --plan` finds the versions not on npm and the commit that
# set them (the version bump of the release PR). That commit is checked out,
# its packages built and tested, and `cl-release ship` then, dependencies
# first, tags each version, publishes it to npm and publishes its GitHub
# release with the notes of its commits. One Slack message lists the release.
# A push with nothing to release ends after the plan.
#
# npm authentication is OIDC trusted publishing, no NPM_TOKEN: each package's
# trusted publisher must name the repository commercelayer/commercelayer-cli
# and this workflow file (publish.yml). Run it by hand to resume a release
# that stopped halfway: what is on npm is skipped.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, never cancelled halfway
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  # contents: write to push the release tags and publish the GitHub releases
  contents: write
  id-token: write

jobs:
  plan:
    name: Versions to release
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      packages: ${{ steps.plan.outputs.packages }}
      dirs: ${{ steps.plan.outputs.dirs }}
      filters: ${{ steps.plan.outputs.filters }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags: the commit that set each version, the previous releases
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 'lts/*', cache: 'pnpm' }
      # The release tooling only: the root package and cl-release
      - run: pnpm install --frozen-lockfile --filter "@commercelayer/cli-monorepo..."
      - name: Plan
        id: plan
        run: pnpm exec cl-release ship --plan

  publish:
    name: Publish ${{ needs.plan.outputs.packages }}
    needs: plan
    if: needs.plan.outputs.commit != ''
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit that set the versions: what was approved in the release PR
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      # No registry-url: it writes an .npmrc with a placeholder token, and
      # pnpm publish authenticates through OIDC trusted publishing instead
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build the packages and their workspace dependencies
        run: pnpm ${{ needs.plan.outputs.filters }} build

      - name: Run specs
        env:
          CL_CLI_ORGANIZATION: cli-test-org
          CL_CLI_CLIENT_ID: ${{ secrets.CL_CLI_CLIENT_ID }}
          CL_CLI_CLIENT_SECRET: ${{ secrets.CL_CLI_CLIENT_SECRET }}
        run: pnpm ${{ needs.plan.outputs.filters }} --workspace-concurrency=1 test

      - name: Command surface vs npm
        run: |
          set -euo pipefail
          for dir in ${{ needs.plan.outputs.dirs }}; do
            pnpm exec cl-release manifest "$dir"
          done

      - name: Tag, publish to npm and release
        id: ship
        run: pnpm exec cl-release ship

      - name: Post to a Slack channel
        if: steps.ship.outputs.released != ''
        uses: slackapi/slack-github-action@v4
        with:
          webhook-type: incoming-webhook
          payload: |
            {
            "text": "New release of ${{ steps.ship.outputs.count }} package(s) of the Commerce Layer CLI.",
            "blocks": [
              {
              "type": "section",
              "text": {
                "type": "mrkdwn",
                "text": "New release of <${{ github.event.repository.html_url }}|Commerce Layer CLI> packages, published to npm:\n${{ steps.ship.outputs.released_md }}\n*<${{ github.event.repository.html_url }}/releases|release notes>*"
              }
              },
              {
              "type": "context",
              "elements": [
                {
                "type": "image",
                "image_url": "${{ github.event.sender.avatar_url }}",
                "alt_text": "${{ github.event.sender.login }}"
                },
                {
                "type": "mrkdwn",
                "text": "*${{ github.event.sender.login }}* has merged this release."
                }
              ]
              }
            ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.PIPELINE_SLACK_CHANNEL_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
