name: Publish

# Publishes to npm when a human publishes a draft release created by
# release.yml, then announces it on Slack. The tagged package is published
# (scripts/publish.mjs), built and tested from exactly the tag, together with
# the workspace dependencies it needs that aren't on npm yet (cli-core,
# cli-ux, … released in the same chore(release) PR); their draft releases
# are then marked published too.
#
# npm authentication is OIDC trusted publishing, no NPM_TOKEN: each package's
# trusted publisher must name the repository commercelayer/commercelayer-cli
# and this workflow file (publish.yml).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re)publish, e.g. orders-v5.7.0'
        required: true

permissions:
  # contents: write to publish the draft releases of the dependencies
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: https://registry.npmjs.org
          cache: 'pnpm'
      - name: npm with trusted publishing support
        run: npm install -g npm@^11.5.1

      # Before resolve-tag, which needs the release scripts' dependencies
      - run: pnpm install --frozen-lockfile

      - name: Resolve package
        id: meta
        run: node scripts/resolve-tag.mjs "$TAG" | tee -a "$GITHUB_OUTPUT"

      - name: Build the package and its workspace dependencies
        run: pnpm --filter '${{ steps.meta.outputs.package }}...' build

      - name: Run specs
        env:
          CL_CLI_ORGANIZATION: cli-test-org
          CL_CLI_CLIENT_ID: ${{ secrets.CL_CLI_CLIENT_ID }}
          CL_CLI_CLIENT_SECRET: ${{ secrets.CL_CLI_CLIENT_SECRET }}
        # The package and its workspace dependencies, which may be published along
        run: pnpm --filter '${{ steps.meta.outputs.package }}...' --workspace-concurrency=1 test

      - name: Command surface vs npm
        run: node scripts/check-manifest.mjs '${{ steps.meta.outputs.dir }}'

      - name: Publish
        id: publish
        run: node scripts/publish.mjs "$TAG"

      - name: Publish the draft releases of the dependencies published along
        if: steps.publish.outputs.published_deps != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in ${{ steps.publish.outputs.published_deps }}; do
            gh release edit "$tag" --draft=false && echo "Published release $tag"
          done

      - name: Post to a Slack channel
        uses: slackapi/slack-github-action@v3
        with:
          webhook-type: incoming-webhook
          payload: |
            {
            "text": "New release ${{ steps.meta.outputs.package }} v${{ steps.meta.outputs.version }}.",
            "blocks": [
              {
              "type": "section",
              "text": {
                "type": "mrkdwn",
                "text": "New release for <${{ github.event.repository.html_url }}|`${{ steps.meta.outputs.package }}`>\n*<${{ github.event.repository.html_url }}/releases/tag/${{ env.TAG }}|release notes>*"
              }
              },
              {
              "type": "section",
              "fields": [
                {
                "type": "mrkdwn",
                "text": "*Package:*\n${{ steps.meta.outputs.package }}"
                },
                {
                "type": "mrkdwn",
                "text": "*Version:*\n${{ steps.meta.outputs.version }} (`${{ steps.meta.outputs.dist_tag }}`)"
                }
              ]
              },
              {
              "type": "context",
              "elements": [
                {
                "type": "image",
                "image_url": "${{ github.event.sender.avatar_url }}",
                "alt_text": "${{ github.event.sender.login }}"
                },
                {
                "type": "mrkdwn",
                "text": "*${{ github.event.sender.login }}* has triggered this release."
                }
              ]
              }
            ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.PIPELINE_SLACK_CHANNEL_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
