name: Verify

# The gate for every change: lint, build and tests.
#
# Lint and build always cover the whole workspace (both are fast). Tests only
# run for the packages a pull request changed plus the packages depending on
# them, so a cli-core change also tests the CLI and every plugin, while a
# change to one plugin tests just that plugin. A change outside packages/ and
# plugins/ (lockfile, root config, workflows) tests everything.
on:
  pull_request:
  push:
    branches: [main, monorepo]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 'lts/*', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Release config is up to date
        run: pnpm exec cl-release labels --check
      - name: Packages are consistent
        run: node scripts/check-packages.mjs

  commits:
    name: Commit messages
    # The commits a pull request brings: merged with a merge commit, each of
    # them reaches the base branch, and the release scripts read them all
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 'lts/*', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile --filter @commercelayer/cli-monorepo
      - name: Conventional Commits
        run: pnpm exec commitlint --from '${{ github.event.pull_request.base.sha }}' --to '${{ github.event.pull_request.head.sha }}' --verbose

  test:
    # The current LTS, and the minimum Node of the packages (engines), where
    # require() of the ESM-only dependencies must work too. The LTS job keeps
    # the plain name, which branch protection refers to.
    name: Build and test${{ matrix.node != 'lts/*' && format(' (Node {0})', matrix.node) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One at a time: the CLI suites share the test organization
      max-parallel: 1
      matrix:
        node: ['lts/*', '22.13']
    steps:
      - uses: actions/checkout@v4
        with:
          # The base commit has to be present to compute the changed packages
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Select packages to test
        id: select
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = pull_request ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git rev-parse -q --verify "$BASE^{commit}" >/dev/null; then
            echo "No usable base, testing everything"
            echo "filter=*" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          if echo "$CHANGED" | grep -vE '^(packages|plugins)/|\.md$' | grep -q .; then
            echo "Changes outside the packages, testing everything"
            echo "filter=*" >> "$GITHUB_OUTPUT"
          else
            echo "filter=...[$BASE]" >> "$GITHUB_OUTPUT"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Run specs
        env:
          CL_CLI_ORGANIZATION: cli-test-org
          CL_CLI_CLIENT_ID: ${{ secrets.CL_CLI_CLIENT_ID }}
          CL_CLI_CLIENT_SECRET: ${{ secrets.CL_CLI_CLIENT_SECRET }}
        # One package at a time: the CLI suites share the test organization
        run: pnpm --filter '${{ steps.select.outputs.filter }}' --filter '!@commercelayer/cli-monorepo' --workspace-concurrency=1 test

      - name: Command surface vs npm
        if: matrix.node == 'lts/*'
        # Informational on pull requests; publish.yml enforces it
        run: |
          set -euo pipefail
          for path in $(pnpm --filter '${{ steps.select.outputs.filter }}' --filter '!@commercelayer/cli-monorepo' list --depth -1 --json | node -e 'for (const p of JSON.parse(require("fs").readFileSync(0))) console.log(require("path").relative(process.cwd(), p.path))'); do
            [ "$path" = "" ] && continue
            pnpm exec cl-release manifest "$(basename "$path")" --warn
          done

  generated:
    name: Generated code is reproducible
    runs-on: ubuntu-latest
    # Regenerates every plugin from its committed snapshot (or installed SDK)
    # and fails if anything differs: a generated file was edited by hand, or
    # a snapshot/SDK update was committed without regenerating.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 'lts/*', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      # gen.config.ts files import cli-core, which resolves to its build
      - run: pnpm --filter @commercelayer/cli-core build
      - run: pnpm generate-local
      - name: Fail on any difference
        run: |
          if ! git diff --exit-code --stat; then
            echo '::error::Generated code is not reproducible from the committed snapshots.'
            echo 'Either a generated file was edited by hand, or the output is stale: run `pnpm generate-local` and commit the result.'
            exit 1
          fi
          untracked=$(git ls-files --others --exclude-standard)
          if [ -n "$untracked" ]; then
            echo '::error::Regeneration produced untracked files:'
            echo "$untracked"
            exit 1
          fi
