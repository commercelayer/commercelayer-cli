name: Integration

# Runs the integration suites (test/integration/*.it.ts): read-only commands
# against the real Core API of the test organization, with the credentials
# of its integration application. Not on every pull request, to spare the
# rate limits and keep reviews independent of the organization's data: on
# pushes to the integration and main branches, every night, on demand, and
# on pull requests that change the suites themselves.
on:
  push:
    branches: [main, monorepo]
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/integration.yml
      - packages/test-utils/src/live.ts
      - '**/test/integration/**'

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration (live API)
    runs-on: ubuntu-latest
    # Secrets are not available to pull requests from forks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 'lts/*', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run integration suites
        env:
          CL_CLI_ORGANIZATION: cli-test-org
          CL_CLI_CLIENT_ID: ${{ secrets.CL_CLI_CLIENT_ID }}
          CL_CLI_CLIENT_SECRET: ${{ secrets.CL_CLI_CLIENT_SECRET }}
        run: |
          # Without credentials the suites are skipped, and the job would pass without testing anything
          if [ -z "$CL_CLI_CLIENT_ID" ] || [ -z "$CL_CLI_CLIENT_SECRET" ]; then
            echo '::error::CL_CLI_CLIENT_ID and CL_CLI_CLIENT_SECRET secrets are required'
            exit 1
          fi
          pnpm test:integration
