name: Integration

# Runs the integration suites (test/integration/*.it.ts) against the real
# Core API of the test organization, with the credentials of its integration
# application: read-only commands, and commands that change data on
# resources the suites create and delete themselves (named cli-it-…). Not on every pull request, to spare the
# rate limits and keep reviews independent of the organization's data: on
# pushes to the integration and main branches, every night, on demand, and
# on pull requests that change the suites themselves or the dependencies.
on:
  push:
    branches: [main, monorepo]
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/integration.yml
      # Dependency updates (an SDK above all) must work against the real API
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - packages/test-utils/src/live.ts
      - '**/test/integration/**'

permissions:
  contents: read

# One run at a time on the shared organization, and never cancelled halfway:
# a cancelled run would leave its test resources behind
concurrency:
  group: integration
  cancel-in-progress: false

jobs:
  integration:
    name: Integration (live API)
    runs-on: ubuntu-latest
    # Secrets are not available to pull requests from forks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 'lts/*', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Remove test resources left by earlier runs
        env: &credentials
          CL_CLI_ORGANIZATION: cli-test-org
          CL_CLI_CLIENT_ID: ${{ secrets.CL_CLI_CLIENT_ID }}
          CL_CLI_CLIENT_SECRET: ${{ secrets.CL_CLI_CLIENT_SECRET }}
          # Optional: the checkout and links suites are skipped without it
          CL_CLI_SALES_CHANNEL_CLIENT_ID: ${{ secrets.CL_CLI_SALES_CHANNEL_CLIENT_ID }}
        run: node scripts/test/live-sweep.mjs

      - name: Run integration suites
        env: *credentials
        run: |
          # Without credentials the suites are skipped, and the job would pass without testing anything
          if [ -z "$CL_CLI_CLIENT_ID" ] || [ -z "$CL_CLI_CLIENT_SECRET" ]; then
            echo '::error::CL_CLI_CLIENT_ID and CL_CLI_CLIENT_SECRET secrets are required'
            exit 1
          fi
          pnpm test:integration

      - name: Remove this run's test resources
        if: always()
        env: *credentials
        run: node scripts/test/live-sweep.mjs
