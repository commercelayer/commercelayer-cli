name: Labeler

# Keeps the `pkg:<dir>` labels in step with the files a PR touches. The
# per-package release-notes configs (.github/release-<dir>.yml) filter on
# them, so the split must not depend on someone labelling every PR by hand.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  # Lets the action create missing labels on first use
  issues: write

jobs:
  label:
    name: Apply package labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          # A label that no longer matches the changed files is removed.
          # Only the labels in .github/labeler.yml are managed.
          sync-labels: true
