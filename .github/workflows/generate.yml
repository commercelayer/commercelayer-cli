name: Regenerate code

# Regenerates the plugins' code against an API environment and, when anything
# changed, opens a pull request with the refreshed snapshots and code, so new
# API triggers and resources arrive as a reviewable PR.
#
# Only plugins with a schema in their gen.config.ts download anything; the
# others regenerate from their installed SDK. Dispatch it from the branch the
# PR should target.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to download the schema from (as declared in each gen.config.ts)'
        type: choice
        required: true
        default: production
        options:
          - production
      api_version:
        description: 'Schema version (e.g. 7.11.6). Leave empty for the latest.'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    name: Regenerate against ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      # Pushes and PRs made with the default GITHUB_TOKEN don't trigger other
      # workflows: use the CI token, so Verify runs on the regeneration PR
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.COMMERCELAYER_CI_TOKEN }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 'lts/*', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @commercelayer/cli-core build

      - name: Regenerate
        run: |
          set -euo pipefail
          ARGS="--env=${{ inputs.environment }}"
          if [ -n "${{ inputs.api_version }}" ]; then ARGS="$ARGS --api-version=${{ inputs.api_version }}"; fi
          # cl-generate directly: pnpm would hand extra args to the last command of a script chain
          pnpm -r exec sh -c "if [ -f gen.config.ts ]; then cl-generate $ARGS; fi"

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ secrets.COMMERCELAYER_CI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo 'Nothing changed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BRANCH="generate/${{ inputs.environment }}-$(date -u +%Y%m%d%H%M)"
          git config user.name 'commercelayer-ci'
          git config user.email 'ci@commercelayer.io'
          git switch -c "$BRANCH"
          git add -A
          git commit -m "chore: regenerate code against ${{ inputs.environment }}"
          git push -u origin "$BRANCH"
          gh pr create --draft --base '${{ github.ref_name }}' --head "$BRANCH" \
            --title "chore: regenerate code against ${{ inputs.environment }}" \
            --body "Regenerated by the [Regenerate code](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) workflow (environment \`${{ inputs.environment }}\`${{ inputs.api_version && format(', schema {0}', inputs.api_version) || '' }}). Review the snapshot diffs in \`plugins/*/gen/*.json\` for the API changes."
          echo "Opened a PR from \`$BRANCH\`." >> "$GITHUB_STEP_SUMMARY"
