allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - "@aws-sdk/client-cloudfront@3.1113.0"
  - "@aws-sdk/client-s3@3.1113.0"
  - electron-to-chromium@1.5.411

# Security overrides: transitive dependencies whose parents still pin a
# vulnerable range upstream. Remove each entry once the parent releases a fix.
overrides:
  # GHSA RCE + DoS - mocha pins serialize-javascript ^6.0.2
  serialize-javascript@<7.0.5: ^7.1.0
  # GHSA DoS in parsePatch/applyPatch - mocha pins diff ^7.0.0
  diff@<8.0.3: ^8.0.3
  # GHSA buffer bounds check - nyc pins istanbul-lib-processinfo, which pins uuid@8.3.2
  uuid@<11.1.1: ^11.1.1
