packages:
  - 'packages/*'
  - 'plugins/*'

# One version for the dependencies the packages share: they declare
# `"<name>": "catalog:"` and the version lives only here.
catalog:
  '@commercelayer/js-auth': ^8.0.1
  '@commercelayer/provisioning-sdk': https://pkg.pr.new/commercelayer/commercelayer-sdk/@commercelayer/provisioning-sdk@5259929
  '@commercelayer/sdk': https://pkg.pr.new/commercelayer/commercelayer-sdk/@commercelayer/sdk@5259929
  '@oclif/core': ^5.1.2
  '@oclif/plugin-help': ^7.0.2
  '@oclif/test': ^5.0.1
  '@types/chai': ^5.2.3
  '@types/cli-progress': ^3.11.6
  '@types/lodash.isempty': ^4.4.9
  '@types/mocha': ^10.0.10
  '@types/node': ^26.6.3
  '@types/node-notifier': ^8.0.5
  'axios': ^1.19.0
  'chai': ^6.2.2
  'chalk': ^6.0.1
  'cli-progress': ^3.12.0
  'cli-table3': ^0.6.5
  'dotenv': ^18.0.4
  'inquirer': ^14.2.2
  'json-2-csv': ^5.6.0
  'lodash.isempty': ^4.4.0
  'mocha': ^12.0.2
  'nock': ^14.0.17
  'node-notifier': ^10.0.1
  'nyc': ^18.0.0
  'oclif': ^6.0.2
  'open': ^11.0.4
  'tslib': ^2.8.1
  'tsup': ^8.5.1
  'tsx': ^4.23.15
  'typescript': ^6.0.3
  'update-notifier-cjs': ^5.1.7

allowBuilds:
  esbuild: true
  yarn: true

# Security overrides: transitive dependencies whose parents still pin a
# vulnerable range upstream. Remove each entry once the parent releases a fix.
overrides:
  # GHSA RCE + DoS - mocha pins serialize-javascript ^6.0.2
  serialize-javascript@<7.0.5: ^7.1.0
  # GHSA DoS in parsePatch/applyPatch - mocha pins diff ^7.0.0
  diff@<8.0.3: ^8.0.4
  # GHSA buffer bounds check - nyc pins istanbul-lib-processinfo, which pins uuid@8.3.2
  uuid@<11.1.1: ^11.1.1
  # GHSA-g7r4-m6w7-qqqr (low) - tsup pins esbuild ^0.27, fixed in 0.28.1
  esbuild@<0.28.1: ^0.28.1
